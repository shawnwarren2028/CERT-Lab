    ${r.pen.length?`<div class="feedback bad"><b>Critical flags</b><ul style="margin:4px 0 0 16px">${r.pen.map(p=>`<li>${p}</li>`).join('')}</ul></div>`:''}
    <div class="feedback info"><b>Teaching points</b><ul style="margin:4px 0 0 16px">${c.teaching.map(t=>`<li>${t}</li>`).join('')}</ul></div>

function renderVitals(){

  const unk='<span class="v-val unk">—</span>';
  const respShown=k.breathing, pulseShown=k.circulation, skinShown=k.circulation, avpuShown=!!k.responsiveness;

function stabilityBar(){
  const cl=G.clock, sev=cl?cl.severity||0:0;
  if(!cl||!cl.t0||G.case.decay==null||cl.coded) return '';
  if(sev<=0 && cl.criticalDone) return '';
  const stab=Math.round((1-sev)*100), stabilizing=cl.criticalDone && sev>0;
  const col=sev>0.66?'var(--danger)':(sev>0.33?'var(--warn)':'var(--primary)');
  const btn=(!cl.criticalDone && G.phase>=2 && G.phase<4)
    ? `<button class="intervene-btn" onclick="openIntervene()">⚡ Intervene now — life-threat</button>` : '';
  return `<div class="stability">
    <div class="stab-top"><span>${stabilizing?'🫀 Stabilizing…':'🫀 Patient stability'}</span><span style="color:${col};font-weight:800">${stab}%</span></div>
    <div class="stab-bar"><span style="width:${stab}%;background:${col}"></span></div>${btn}</div>`;
}
/* express life-saving intervention: treat the recognized life-threat without finishing the full survey */
function openIntervene(){
  const c=G.case, d=c.decay; if(!d||G.clock.criticalDone) return;
  const opts=[];
  if(d.haltKey==='bleed') opts.push({key:'bleed',label:'Control the major bleeding (direct pressure / tourniquet)',ok:true});
  else if(c.treatments.map[d.haltKey]) opts.push({key:d.haltKey,label:c.treatments.map[d.haltKey].label,ok:true});
  Object.keys(c.treatments.harmful).slice(0,2).forEach(k=>opts.push({key:k,label:c.treatments.harmful[k].label,ok:false}));
  const sh=shuffle(opts);
  window._ivOpts={}; sh.forEach((o,i)=>window._ivOpts[i]=o);
  openOv(`<h2>⚡ Life-saving intervention</h2>
    <p style="text-align:center;color:var(--text-muted)"><b>${c.name}</b> is deteriorating — act now.</p>
    <div class="choices" style="margin-top:10px">${sh.map((o,i)=>`<button class="choice" onclick="doIntervene(${i})"><span class="c-num">${i+1}</span>${o.label}</button>`).join('')}</div>`);
}
function doIntervene(i){
  const o=window._ivOpts[i], c=G.case;
  if(o.ok){ SND.good();
    if(o.key==='bleed'){ G.primary.bleedCtrl=true; G.known.bleedingControlled=true; flag('bleeding',1); }
    else G.treatment.applied[o.key]=true;
    haltDecay(); closeOv();
    logMsg('Life-saving intervention performed — patient begins to stabilize.','good');
    renderVitals(); renderPatient(); if(PHASES[G.phase].id==='treatment') renderPhase();
  } else { SND.bad();
    G.score.penalties.push('Wrong emergency intervention on a deteriorating patient.');
    logMsg('Wrong emergency intervention — patient still deteriorating.','bad');
    const bad=c.treatments.harmful[o.key];
    openOv(`<h2 style="color:var(--danger)">✗ That won't help</h2>
      <div class="feedback bad">${bad?bad.bad:'That isn’t the life-saving action this patient needs.'}</div>
      <div class="btn-row"><button class="btn primary" onclick="openIntervene()">Try again</button>
      <button class="btn" onclick="closeOv()">Close</button></div>`);
  }
}

  else if(P.id==='secondary') h.textContent='Click each body region to examine it head-to-toe.';
  else if(P.id==='primary') h.textContent='Assess responsiveness and ABCs using the panel →';
  else h.textContent='';
}
function getNextHint(){
  const P=PHASES[G.phase], s=G.sizeup, pr=G.primary, c=G.case;
  if(P.id==='sizeup'){ if(!s.ppeDone) return 'put on your PPE (BSI)'; if(!s.sceneDone) return 'size up scene safety';
    if(!s.resDone) return 'confirm patients & call for resources'; return 'approach the patient'; }
  if(P.id==='primary'){ if(!pr.consent) return 'introduce yourself & get consent'; if(!pr.avpu) return 'check responsiveness (AVPU)';
    if(!pr.airway) return 'check the airway'; if(!pr.breathing) return 'check breathing'; if(!pr.circ) return 'check circulation';
    if(!pr.bleedScan) return 'scan for major bleeding'; if(c.bleeding&&!pr.bleedCtrl) return 'control the major bleeding now';
    return 'go to triage'; }
  if(P.id==='triage') return 'apply R-P-M, then tag the patient';
  if(P.id==='secondary'){ const ex=REGIONS.filter(r=>G.examined[r]).length; if(ex<9) return 'examine the whole body (don’t forget the back)';
    if(Object.keys(G.interview.sample).length<6) return 'take the SAMPLE history';
    if(c.pain&&Object.keys(G.interview.opqrst).length<6) return 'ask OPQRST about the pain'; return 'move to treatment'; }
  if(P.id==='treatment') return 'give the care this patient needs — avoid harmful options';
  return '';
}

/* ---------- SVG patient ---------- */
function renderPatient(){
  const c=G.case, wrap=document.getElementById('body-wrap');
  const label=document.getElementById('region-label');
  const front=(G.view==='front');
  const svg=buildBodySVG(front,G.case);
  wrap.querySelector('svg')?.remove();
  wrap.insertAdjacentHTML('beforeend',svg);
  // wire hotspots
  wrap.querySelectorAll('.hot').forEach(h=>{
    const reg=h.getAttribute('data-region');
    h.addEventListener('click',()=>onRegionClick(reg));
    h.addEventListener('mouseenter',e=>{ label.textContent=REGION_NAME[reg]; label.style.opacity='1';
      positionLabel(e,wrap,label); });
    h.addEventListener('mousemove',e=>positionLabel(e,wrap,label));
    h.addEventListener('mouseleave',()=>{ label.style.opacity='0'; });
    if(G.examined[reg]) h.classList.add('examined');
    if(regionFlagged(reg)) h.classList.add('flagged');
  });
  // flip button label
  document.getElementById('flip-btn').textContent = front?'🔄 Check back':'🔄 Front';
  drawMarkers(wrap,front);
}
function positionLabel(e,wrap,label){ const r=wrap.getBoundingClientRect();
  label.style.left=(e.clientX-r.left)+'px'; label.style.top=(e.clientY-r.top)+'px'; }

function regionFlagged(reg){ // any discovered critical/warn finding shown on the body
  if(!G.examined[reg]) return false;
  const f=(G.case.findings[reg]||[]); return f.some(x=>x.tag&&x.sev!=='info');
}

/* marker coordinates (front / back) for the current viewBox 0 0 220 470 */
const MK_FRONT={head:[92,40],eyes:[126,48],neck:[110,92],chest:[110,140],abdomen:[110,196],
  pelvis:[110,238],arms:[[60,168],[160,168]],legs:[[92,360],[128,360]],back:null};
const MK_BACK={head:[110,44],neck:[110,92],back:[110,170],pelvis:[110,238],
  arms:[[60,168],[160,168]],legs:[[92,360],[128,360]],eyes:null,chest:null,abdomen:null};

function drawMarkers(wrap,front){
  const svg=wrap.querySelector('svg'); if(!svg)return;
  // clear old
  svg.querySelectorAll('.mk').forEach(n=>n.remove());
  const map=front?MK_FRONT:MK_BACK;
  const TAG_ICON={bleed:'🩸',burn:'🔥',deformity:'🦴',pain:'❗',skin:'⚕️'};
  Object.keys(G.case.findings).forEach(reg=>{
    if(!G.examined[reg]) return;
    const coords=map[reg]; if(!coords) return;
    const flist=(G.case.findings[reg]||[]).filter(f=>f.tag&&f.sev!=='info');
    const tags=[...new Set(flist.map(f=>f.tag))];
    if(!tags.length) return;
    let spots=Array.isArray(coords[0])?coords:[coords];
    // for paired limbs, localize to the injured side from the finding text
    if(spots.length===2){
      const txt=flist.map(f=>f.t).join(' ').toLowerCase();
      const L=/\bleft\b/.test(txt), R=/\bright\b/.test(txt);
      if(L&&!R) spots=[spots[1]];       // patient left  = viewer right (larger x)
      else if(R&&!L) spots=[spots[0]];  // patient right = viewer left  (smaller x)
    }
    spots.forEach(([x,y])=>{
      tags.slice(0,2).forEach((tg,i)=>{
        const g=document.createElementNS('http://www.w3.org/2000/svg','text');
        g.setAttribute('class','mk'); g.setAttribute('x',x+(tags.length>1?(i*16-8):0));
        g.setAttribute('y',y); g.setAttribute('text-anchor','middle');
        g.setAttribute('font-size','15'); g.textContent=TAG_ICON[tg]||'❗';
        svg.appendChild(g);
      });
    });
  });
}

/* derive a facial-expression state from the patient's live condition (general impression) */
function getFace(c){
  const r=c.responsiveness, skin=((c.circulation&&c.circulation.skin)||'').toLowerCase();
  const f={eyes:'open',mouth:'neutral',tint:null,sweat:false,droop:null,swell:false,wide:false,lips:null,pupils:null};
  if(r==='verbal') f.eyes='half'; else if(r==='pain'||r==='unresponsive') f.eyes='closed';
  if(/cyanot|blue|dusky|bluish/.test(skin)){ f.tint='cyan'; f.lips='blue'; }
  else if(/pale|ashen|waxy|gray/.test(skin)) f.tint='pale';
  else if(/flush|red|hot/.test(skin)) f.tint='flush';
  if(/sweat|clammy|diaphor/.test(skin)) f.sweat=true;
  if(c.pain && f.eyes!=='closed') f.mouth='grimace';
  if(c.breathing && c.breathing.adequate===false && f.eyes!=='closed') f.mouth='open';
  if(c.archetype==='stroke') f.droop=c.faceDroopSide||'left';
  if(c.archetype==='anaphylaxis') f.swell=true;
  if((c.archetype==='choking'||c.archetype==='anaphylaxis') && f.eyes!=='closed'){ f.wide=true; if(f.mouth==='neutral') f.mouth='open'; }
  if(c.pupilsUnequal && typeof G!=='undefined' && G && G.examined && G.examined.eyes) f.pupils='unequal';
  return f;
}
function faceSVG(f,line){
  let s='';
  const tints={pale:'rgba(232,232,232,.44)',cyan:'rgba(86,140,212,.44)',flush:'rgba(214,92,70,.34)'};
  if(f.tint) s+=`<ellipse cx="110" cy="49" rx="28" ry="27" fill="${tints[f.tint]}"/>`;
  const eye=(x,droopy)=>{ const y=44+(droopy?3:0);
    if(f.eyes==='closed') return `<path d="M${x-6} ${y} Q${x} ${y+4} ${x+6} ${y}" fill="none" stroke="#2a1c12" stroke-width="2" stroke-linecap="round"/>`;
    if(f.eyes==='half') return `<line x1="${x-5}" y1="${y}" x2="${x+5}" y2="${y}" stroke="#2a1c12" stroke-width="2.4" stroke-linecap="round"/><circle cx="${x}" cy="${y+1}" r="1.6" fill="#2a1c12"/>`;
    if(f.wide) return `<ellipse cx="${x}" cy="${y}" rx="5" ry="6" fill="#fff" stroke="${line}" stroke-width="1"/><circle cx="${x}" cy="${y}" r="2.6" fill="#2a1c12"/>`;
    const blown=(f.pupils==='unequal'&&x>110);
    return `<ellipse cx="${x}" cy="${y}" rx="4" ry="5" fill="#fbfbfb" stroke="${line}" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="${blown?3.6:2.3}" fill="#2a1c12"/>`;
  };
  s+=eye(98,f.droop==='right')+eye(122,f.droop==='left');
  if(f.sweat) s+=`<g fill="rgba(120,185,235,.9)"><ellipse cx="88" cy="34" rx="1.8" ry="3.2"/><ellipse cx="133" cy="36" rx="1.8" ry="3.2"/><ellipse cx="126" cy="53" rx="1.6" ry="2.8"/></g>`;
  const lipCol=f.lips==='blue'?'#5f83c8':'#7a3b2f';
  if(f.swell) s+=`<ellipse cx="110" cy="61" rx="11" ry="5.5" fill="${f.lips==='blue'?'#6a86c0':'#c56b5f'}" stroke="${line}" stroke-width=".8"/>`;
  else if(f.mouth==='open') s+=`<ellipse cx="110" cy="61" rx="6.5" ry="6" fill="#3a1e1e" stroke="${lipCol}" stroke-width="1.6"/>`;
  else if(f.mouth==='grimace') s+=`<rect x="101" y="57" width="18" height="7" rx="2.5" fill="#3a1e1e"/><g stroke="#e8e2d8" stroke-width="1.1"><line x1="106" y1="57" x2="106" y2="64"/><line x1="110" y1="57" x2="110" y2="64"/><line x1="114" y1="57" x2="114" y2="64"/></g>`;
  else if(f.droop) s+=(f.droop==='left'
      ? `<path d="M101 60 Q110 62 119 66" fill="none" stroke="${lipCol}" stroke-width="2.4" stroke-linecap="round"/>`
      : `<path d="M101 66 Q110 62 119 60" fill="none" stroke="${lipCol}" stroke-width="2.4" stroke-linecap="round"/>`);
  else s+=`<path d="M102 61 Q110 63 118 61" fill="none" stroke="${lipCol}" stroke-width="2.2" stroke-linecap="round"/>`;
  return s;
}

function buildBodySVG(front,c){
  const skin=c.skin.fill, line=c.skin.line, shirt=c.shirt, pants=c.pants, hair=c.hair;
  const longHair=c.hairStyle==='long';
  const head = front
    ? `${longHair?`<path d="M74 40 Q72 96 84 104 L88 60 Q80 44 82 30 Q110 4 138 30 Q140 44 132 60 L136 104 Q148 96 146 40 Q140 8 110 8 Q80 8 74 40" fill="${hair}"/>`:''}
       <circle cx="110" cy="46" r="30" fill="${skin}" stroke="${line}" stroke-width="2"/>
       ${faceSVG(getFace(c),line)}
       <path d="M80 30 Q110 6 140 30 Q140 20 110 16 Q80 20 80 30" fill="${hair}"/>`
    : `${longHair?`<path d="M76 40 Q74 104 110 108 Q146 104 144 40 Q140 8 110 8 Q80 8 76 40" fill="${hair}"/>`:''}

    <!-- pelvis/pants -->

    <!-- legs -->
    <path d="M84 268 L104 268 L102 360 L98 430 L84 430 L82 360 Z" fill="${pants}" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
    <path d="M116 268 L136 268 L138 360 L136 430 L122 430 L118 360 Z" fill="${pants}" stroke="rgba(0,0,0,.3)" stroke-width="2"/>
    <!-- shoes -->
    <path d="M80 430 L98 430 L100 444 Q90 450 78 446 Z" fill="#22303f"/>

    ${front?'<rect class="hot" data-region="eyes" x="86" y="36" width="48" height="16" rx="6"/>':''}
    <rect class="hot" data-region="neck" x="96" y="70" width="28" height="24" rx="6"/>
    ${front
      ? `<rect class="hot" data-region="chest" x="74" y="94" width="72" height="60" rx="10"/>
         <rect class="hot" data-region="abdomen" x="76" y="154" width="68" height="52" rx="10"/>`
      : `<rect class="hot" data-region="back" x="74" y="94" width="72" height="112" rx="10"/>`}

  return `<svg class="patient" viewBox="0 0 220 470" xmlns="http://www.w3.org/2000/svg" aria-label="Patient figure">

}

function flipBody(){ SND.click(); G.view=(G.view==='front')?'back':'front'; renderPatient(); }

/* region click — behavior depends on phase (examine in secondary; contextual elsewhere) */
function onRegionClick(reg){
  const P=PHASES[G.phase];
  if(P.id==='secondary'){ examineRegion(reg); return; }
  if(P.id==='primary'){
    // map body regions to the matching primary check for tactile interaction
    const pr=G.primary;
    if((reg==='head'||reg==='eyes')&&!pr.avpu) return pAvpu();
    if(reg==='neck'&&!pr.airway) return pAirway();
    if(reg==='chest'&&!pr.breathing) return pBreathing();
    if((reg==='arms'||reg==='neck')&&!pr.circ) return pCirc();
    SND.click(); primFb('info',`Use the panel actions to complete the primary survey. (Tapped the ${REGION_NAME[reg].toLowerCase()}.)`);
    return;
  }
  if(P.id==='treatment'){ SND.click(); return; }
  SND.click();
  flashPanelNote(`You’ll examine the ${REGION_NAME[reg].toLowerCase()} during the assessment phases.`);
}

function examineRegion(reg,quiet){
  const firstLook=!G.examined[reg];
  G.examined[reg]=true; SND.open();
  const f=G.case.findings[reg]||[];
  if(firstLook) logMsg(`Examined ${REGION_NAME[reg].toLowerCase()}.`,f.some(x=>x.sev!=='info')?'bad':'');
  // persist the finding so it survives panel re-render
  G.secondary.lastReg=reg;
  G.secondary.lastFindingHtml = f.length
    ? `<div class="f-region">${REGION_NAME[reg]}</div><ul>${f.map(x=>`<li>${x.t}</li>`).join('')}</ul>`
    : `<div class="f-region">${REGION_NAME[reg]}</div><div class="f-none">No abnormal findings.</div>`;
  renderPatient();
  if(PHASES[G.phase].id==='secondary') renderPhase();
  else { const slot=document.getElementById('exam-findings'); if(slot){ slot.innerHTML=G.secondary.lastFindingHtml; slot.style.display='block'; } }
}

function flashPanelNote(msg){
  let n=document.getElementById('panel-note');
  if(!n){ n=document.createElement('div'); n.id='panel-note'; n.className='feedback info';
    document.getElementById('panel').appendChild(n); }
  n.textContent=msg;
}

/* ---------- overlay ---------- */
function openOv(html){ document.getElementById('ov-box').innerHTML=html; document.getElementById('ov').classList.add('show'); }
function closeOv(){ document.getElementById('ov').classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOv(); });

/* ---------- boot ---------- */
['pointerdown','keydown','touchstart'].forEach(ev=>
  window.addEventListener(ev,function once(){ SND.arm(); },{once:true}));
SND.init();
openTierSelect();
