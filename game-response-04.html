<style>
  :root{
    --bg:#0e1208; --surface:#1a2012; --surface2:#243018; --border:#3a5228;
    --primary:#5aaa3a; --primary-dark:#4a8f2e; --primary-light:#7ac95a;
    --text:#eef2e8; --text-muted:#8aa87a; --radius:12px; --gold:#e8c33a;
    --danger:#ef4444; --warn:#f59e0b; --min:#27ae60;
  }
  [data-theme="light"]{
    --bg:#eef3e7; --surface:#ffffff; --surface2:#e7eedd; --border:#c2d2af;
    --primary:#41902e; --primary-dark:#317022; --primary-light:#5aaa3a;
    --text:#16210d; --text-muted:#5c6e4a; --muted:#5c6e4a;
  }
  [data-theme="light"] header{background:#e3ecd6;}
  [data-theme="light"] footer{background:#e3ecd6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;}

  header{width:100%;background:#111a09;border-bottom:3px solid var(--primary);
    padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  #cert-logo{height:48px;width:auto;}
  .logo-badge{background:var(--primary);color:#000;font-weight:900;font-size:1.05rem;letter-spacing:.1em;padding:6px 12px;border-radius:6px;}
  header h1{font-size:1.12rem;font-weight:700;color:var(--primary);}
  header p{font-size:0.76rem;color:var(--text-muted);}
  .hdr-text{flex:1 1 0;min-width:0;}
  .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:9px;}
  .home-link{color:var(--primary-light);text-decoration:none;font-size:0.85rem;font-weight:600;
    border:1px solid var(--border);padding:8px 14px;border-radius:8px;transition:.15s;white-space:nowrap;}
  .home-link:hover{background:var(--surface2);border-color:var(--primary);}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;line-height:1;
    padding:8px 11px;border-radius:8px;cursor:pointer;transition:.15s;}
  .icon-btn:hover{border-color:var(--primary);}

  main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:16px 18px 26px;display:flex;flex-direction:column;gap:14px;}

  .panel-frame{position:relative;border:3px solid #0a0e07;border-radius:6px;overflow:hidden;
    background:#0a0e07 radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.4px) 0 0/14px 14px;
    box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);}
  [data-theme="light"] .panel-frame{border-color:#1a1a1a;}
  svg.scene{display:block;width:100%;height:auto;}
  .issue-tag{position:absolute;top:10px;left:10px;background:var(--gold);color:#1a1400;font-weight:900;
    font-size:0.68rem;letter-spacing:.06em;padding:4px 9px;border-radius:4px;transform:rotate(-2deg);
    box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2;}

  .caption-box{background:#f4ecd2;color:#1a1608;border:2px solid #1a1608;border-radius:2px;
    padding:10px 14px;font-size:0.92rem;font-weight:600;line-height:1.5;margin:-3px 12px 0;
    box-shadow:0 4px 10px rgba(0,0,0,.35);position:relative;z-index:2;font-family:Georgia,'Times New Roman',serif;}
  .caption-box b{color:#7a1010;}

  .speech-wrap{display:flex;gap:10px;align-items:flex-start;margin:2px 4px 0;}
  .speech-bubble{background:#fff;color:#111;border:2px solid #111;border-radius:16px;padding:10px 16px;
    font-size:0.92rem;font-weight:600;line-height:1.45;position:relative;max-width:520px;box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .speech-bubble::before{content:'';position:absolute;top:-2px;left:26px;width:16px;height:16px;background:#fff;
    border-left:2px solid #111;border-top:2px solid #111;transform:rotate(45deg) translateY(-8px);}
  .speech-name{font-size:0.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-light);
    margin-bottom:6px;}

  .sfx-text{position:absolute;font-family:Impact,'Arial Black',sans-serif;font-weight:900;letter-spacing:.02em;
    color:#fff200;-webkit-text-stroke:2px #1a1200;text-shadow:3px 3px 0 #1a1200;transform:rotate(-6deg);
    z-index:3;pointer-events:none;}

  .hint-row{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--text-muted);padding:2px 4px;}
  .hint-row .pip{width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;
    box-shadow:0 0 6px var(--gold);animation:pip 1.4s ease-in-out infinite;}
  @keyframes pip{0%,100%{opacity:.5}50%{opacity:1}}

  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-size:0.92rem;font-weight:600;padding:12px 14px;border-radius:10px;cursor:pointer;transition:.14s;
    font-family:inherit;}
  .opt:hover{border-color:var(--primary);background:var(--border);}
  .opt.done{opacity:.55;border-color:var(--min);cursor:default;}
  .opt .n{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;flex-shrink:0;}

  .tag-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tag-btn{flex:1 1 100px;padding:14px 10px;border-radius:10px;font-weight:800;font-size:0.9rem;cursor:pointer;
    border:2px solid; text-align:center;transition:.14s;font-family:inherit;}
  .tag-btn.green{background:rgba(90,170,58,.15);border-color:var(--min);color:var(--min);}
  .tag-btn.yellow{background:rgba(232,195,58,.15);border-color:var(--gold);color:var(--gold);}
  .tag-btn.red{background:rgba(239,68,68,.15);border-color:var(--danger);color:var(--danger);}
  .tag-btn:hover{transform:translateY(-2px);}

  .patient-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .patient-chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;
    font-size:0.84rem;font-weight:700;display:flex;align-items:center;gap:8px;}
  .patient-chip .dot{width:12px;height:12px;border-radius:50%;background:var(--text-muted);}
  .patient-chip .dot.green{background:var(--min);} .patient-chip .dot.yellow{background:var(--gold);}
  .patient-chip .dot.red{background:var(--danger);} .patient-chip .dot.pending{background:var(--text-muted);}

  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.92rem;font-weight:700;
    padding:12px 20px;border-radius:9px;cursor:pointer;transition:.15s;font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;justify-content:center;}
  .btn:hover{border-color:var(--primary);background:var(--border);}
  .btn.primary{background:var(--primary);color:#06210a;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-light);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

  .notes-panel{background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;}
  .notes-panel h4{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
  .notes-panel ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .notes-panel li{font-size:0.84rem;color:var(--text);}

  .cover{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;text-align:center;}
  .cover .num{color:var(--gold);font-weight:900;letter-spacing:.15em;font-size:0.78rem;}
  .cover h2{font-size:1.7rem;font-weight:900;color:var(--primary);margin:6px 0 10px;letter-spacing:.02em;}
  .cover p{color:var(--text-muted);font-size:0.92rem;max-width:520px;margin:0 auto 14px;line-height:1.55;}
  .skill-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:16px;}
  .skill-chip{font-size:0.74rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;
    padding:5px 11px;color:var(--text);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card h3{font-size:1.05rem;color:var(--primary);margin-bottom:6px;}
  .card p{font-size:0.88rem;color:var(--text-muted);line-height:1.5;}

  .score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0;}
  .score-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .score-item .lbl{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .score-item .val{font-size:1.3rem;font-weight:800;color:var(--primary);}
  .overall{text-align:center;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;}
  .overall .pct{font-size:2.4rem;font-weight:900;color:var(--gold);}
  .overall .stars{font-size:1.3rem;letter-spacing:.1em;}

  .check-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 16px;}
  .check-item{display:flex;gap:9px;align-items:flex-start;font-size:0.86rem;background:var(--bg);
    border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
  .check-item .ic{flex-shrink:0;}
  .check-item.ok .ic{color:var(--min);} .check-item.warn .ic{color:var(--warn);}
  .instr-note{background:var(--surface2);border-left:3px solid var(--gold);border-radius:6px;padding:10px 13px;
    font-size:0.84rem;color:var(--text);margin-top:6px;}
  .instr-note b{color:var(--gold);}

  footer{text-align:center;padding:16px;color:var(--text-muted);font-size:0.74rem;border-top:1px solid var(--border);}
  footer span{color:var(--primary);}
</style>
</head>
<body>

<header>
  <img id="cert-logo" src="readiness-arcade-logo.png" alt="Readiness Arcade"
    onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
  <div id="logo-fallback" style="display:none;align-items:center;"><div class="logo-badge">RA</div></div>
  <div class="hdr-text">
    <h1>Field Response</h1>
    <p>Issue 04 · The Parking Lot</p>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn" id="sfx-btn" onclick="SND.toggle()" title="Sound effects">🔊</button>
    <a class="home-link" href="game-response.html">← Issues</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle light or dark mode">☀️</button>
  </div>
</header>

<main id="main"></main>

<footer><span>Readiness Arcade</span> · Field Response · For educational use, this is not medical advice. If a true emergency contact 911 or your local EMS — follow your local CERT program guidelines.</footer>

<script>
/* ============================================================
   SFX
============================================================ */
const SND=(function(){
  let ctx,on=(localStorage.getItem('cert_response_sfx')!=='off'),comp;
  function ac(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); comp=ctx.createDynamicsCompressor(); comp.connect(ctx.destination);} return ctx; }
  function tone(f,t,type,g,dur){ if(!on)return; ac(); const o=ctx.createOscillator(),ga=ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,ctx.currentTime+t);
    ga.gain.setValueAtTime(0,ctx.currentTime+t); ga.gain.linearRampToValueAtTime(g||.2,ctx.currentTime+t+.01);
    ga.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+(dur||.2));
    o.connect(ga); ga.connect(comp); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+(dur||.2)+.02); }
  return {
    click(){ tone(520,0,'square',.12,.06); },
    good(){ tone(660,0,'sine',.18,.12); tone(880,.08,'sine',.16,.16); },
    bad(){ tone(220,0,'sawtooth',.16,.22); },
    win(){ tone(523,0,'sine',.18,.14); tone(659,.1,'sine',.18,.14); tone(784,.2,'sine',.2,.3); },
    toggle(){ on=!on; localStorage.setItem('cert_response_sfx',on?'on':'off'); document.getElementById('sfx-btn').textContent=on?'🔊':'🔇'; if(on){ac();this.click();} },
    init(){ document.getElementById('sfx-btn').textContent=on?'🔊':'🔇'; }
  };
})();

/* ============================================================
   ART SWAP-IN POINT
============================================================ */
const PANEL_ART = {
  establish: 'response-issue04-establish.png',
  hazards:   'response-issue04-hazards.png',
  overview:  'response-issue04-overview.png',
  p1:        'response-issue04-p1.png',
  p2:        'response-issue04-p2.png',
  p3:        'response-issue04-p3.png',
  p3_deteriorated: 'response-issue04-p3-deteriorated.png',
  outcome:   'response-issue04-outcome.png',
};

/* ============================================================
   SCENE RENDERING — comic-ink vector art
============================================================ */
const DEFS = `
  <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5a6a80"/><stop offset="100%" stop-color="#c9a870"/>
  </linearGradient>`;

function hotspot(x,y,r,id,found,pulse){
  if(found){
    return `<g class="hotspot" onclick="clickHotspot('${id}')" style="cursor:pointer" pointer-events="all">
      <circle cx="${x}" cy="${y}" r="${r}" fill="rgba(90,170,58,.15)" stroke="#5aaa3a" stroke-width="2.5"/>
      <path d="M${x-r*0.4} ${y} l${r*0.28} ${r*0.28} l${r*0.5} -${r*0.55}" stroke="#5aaa3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;
  }
  const hitR = Math.round(r*0.55);
  return `<g class="hotspot" onclick="clickHotspot('${id}')" style="cursor:pointer" pointer-events="all">
    <circle cx="${x}" cy="${y}" r="${hitR}" fill="transparent" stroke="${pulse?'#e8c33a':'none'}" stroke-width="2" ${pulse?'filter="url(#hglow)"':''}/>
    <circle cx="${x}" cy="${y}" r="2.5" fill="${pulse?'#e8c33a':'rgba(232,195,58,.5)'}"/>
  </g>`;
}
function svgWrap(inner){
  return `<svg class="scene" viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg"><defs>${DEFS}</defs>${inner}</svg>`;
}
function art(key, fallback){
  if(PANEL_ART[key]) return `<image href="${PANEL_ART[key]}" x="0" y="0" width="800" height="533" preserveAspectRatio="xMidYMid slice"/>`;
  return fallback;
}
function lotBase(){
  return `
    <rect width="800" height="533" fill="url(#sky)"/>
    <rect x="0" y="340" width="800" height="193" fill="#4a4a48"/>
    <rect x="0" y="340" width="800" height="6" fill="#e8c33a" opacity=".7"/>
    <g stroke="#0a0e07" stroke-width="4" fill="#5a3a3a">
      <rect x="120" y="260" width="180" height="100" rx="10"/>
      <rect x="130" y="245" width="70" height="30" rx="4"/>
    </g>
    <g stroke="#0a0e07" stroke-width="4" fill="#3a4a5a">
      <rect x="340" y="270" width="170" height="95" rx="10"/>
      <rect x="440" y="255" width="65" height="28" rx="4"/>
    </g>
    <g fill="#8a7050" opacity=".8">
      <rect x="600" y="300" width="60" height="90"/>
      <rect x="680" y="300" width="60" height="90"/>
    </g>`;
}

function sceneEstablish(){
  const bg = `${lotBase()}
    <ellipse cx="440" cy="330" rx="30" ry="10" fill="#ccc" opacity=".5"/>
    <g>
      <rect x="30" y="400" width="18" height="42" rx="3" fill="#3a5228" stroke="#0a0e07" stroke-width="3"/>
      <circle cx="39" cy="388" r="12" fill="#5aaa3a" stroke="#0a0e07" stroke-width="3"/>
    </g>
    <g opacity=".7">
      <circle cx="720" cy="400" r="9" fill="#c9b090" stroke="#0a0e07" stroke-width="2"/>
      <rect x="712" y="408" width="16" height="26" fill="#8a7860" stroke="#0a0e07" stroke-width="2"/>
    </g>`;
  return svgWrap(art('establish', bg));
}
function sceneHazards(){
  const bg = `${lotBase()}
    <ellipse cx="300" cy="358" rx="34" ry="8" fill="#1a1a1a" opacity=".7"/>
    <g stroke="#0a0e07" stroke-width="2" fill="#7fa8d8" opacity=".7">
      <polygon points="250,370 268,362 264,384 246,382"/>
    </g>
    <rect x="600" y="330" width="14" height="60" fill="#222" stroke="#0a0e07" stroke-width="3" transform="rotate(75 607 360)"/>
    <circle cx="640" cy="345" r="8" fill="#ffe680" opacity=".85"/>`;
  return svgWrap(art('hazards', bg));
}
function sceneOverview(tags){
  const dot = (t)=> t==='green'?'#5aaa3a':t==='yellow'?'#e8c33a':t==='red'?'#ef4444':'#8a8478';
  const bg = `${lotBase()}
    <g class="hotspot" onclick="clickHotspot('patient-p1')" style="cursor:pointer" pointer-events="all">
      <circle cx="150" cy="330" r="16" fill="${dot(tags.p1)}" stroke="#0a0e07" stroke-width="3"/>
      <rect x="140" y="346" width="20" height="30" fill="#5a4a3a" stroke="#0a0e07" stroke-width="2"/>
    </g>
    <g class="hotspot" onclick="clickHotspot('patient-p2')" style="cursor:pointer" pointer-events="all">
      <circle cx="270" cy="260" r="16" fill="${dot(tags.p2)}" stroke="#0a0e07" stroke-width="3"/>
      <rect x="255" y="276" width="30" height="24" fill="#4a5a6a" stroke="#0a0e07" stroke-width="2"/>
    </g>
    <g class="hotspot" onclick="clickHotspot('patient-p3')" style="cursor:pointer" pointer-events="all">
      <circle cx="580" cy="400" r="16" fill="${dot(tags.p3)}" stroke="#0a0e07" stroke-width="3"/>
      <rect x="550" y="412" width="60" height="16" rx="6" fill="#5a4a3a" stroke="#0a0e07" stroke-width="2"/>
    </g>`;
  return svgWrap(art('overview', bg));
}
function sceneOutcome(){
  const bg = `${lotBase()}
    <g stroke="#0a0e07" stroke-width="4" fill="#fff">
      <rect x="80" y="260" width="140" height="90" rx="8"/>
      <rect x="500" y="255" width="150" height="95" rx="8"/>
    </g>
    <g fill="#e8c33a">
      <circle cx="150" cy="255" r="10"/><circle cx="575" cy="250" r="10"/>
    </g>`;
  return svgWrap(art('outcome', bg));
}
function scenePatientDetail(key, tagColor){
  const colors = {p1:'#d9b48a', p2:'#c9a878', p3:'#b7a898'};
  const bg = `
    <rect width="800" height="533" fill="url(#sky)"/>
    <rect x="0" y="340" width="800" height="193" fill="#4a4a48"/>
    <circle cx="400" cy="260" r="70" fill="${colors[key]||'#d9b48a'}" stroke="#0a0e07" stroke-width="5"/>
    <rect x="350" y="320" width="100" height="140" rx="14" fill="#5a5a58" stroke="#0a0e07" stroke-width="5"/>
    ${tagColor?`<rect x="370" y="200" width="60" height="26" rx="4" fill="${tagColor}" stroke="#0a0e07" stroke-width="3" transform="rotate(-8 400 213)"/>`:''}`;
  const artKey = (key==='p3' && S.patients.p3.deteriorated) ? 'p3_deteriorated' : key;
  return svgWrap(art(artKey, bg));
}

/* ============================================================
   STATE
============================================================ */
const ISSUE = {n:'04', title:'THE PARKING LOT', level:'Level 2 — Intermediate',
  skills:['Triage','Multiple Patients','Prioritization','Resources']};
const ISSUE_KEY = '04';

const HAZARDS = {
  traffic: {
    name:'Uncontrolled traffic lane',
    found:'Cars are still moving through the adjacent lane — nobody has blocked traffic away from the scene yet.',
    choices:[
      {t:'Position a vehicle to block the lane and flag traffic away', good:true},
      {t:"Just ask bystanders to keep an eye out", good:false,
        note:'Bystanders are not a substitute for physically blocking the hazard. Traffic control needs a real barrier, not a lookout.'},
      {t:"It's a parking lot, cars go slow — it's fine", good:false,
        note:"Slow-moving traffic still hits people. Treat an uncontrolled lane near a scene as a real hazard."}
    ]
  },
  fuel: {
    name:'Fuel leak',
    found:'A thin stream of fluid is leaking from the front of one car — could be fuel.',
    choices:[
      {t:'Note it, keep ignition sources away, and avoid the puddle', good:true},
      {t:'Try to see if you can plug the leak', good:false,
        note:"Handling a vehicle fuel leak is outside CERT scope. Note it, avoid it, and let Fire/utility handle it directly."},
      {t:"It's probably just water — ignore it", good:false,
        note:"Don't assume. Treat any unknown fluid leaking from a damaged vehicle as a fuel hazard until proven otherwise."}
    ]
  }
};
function freshState(){
  return {
    phase:'cover',
    hazards:{traffic:{found:false,resolved:false}, fuel:{found:false,resolved:false}},
    activeHazard:null, hintTarget:null,
    patients:{
      p1:{name:'Jake', tag:null, correctTag:'green', treated:false},
      p2:{name:'Renee', tag:null, correctTag:'yellow', treated:false},
      p3:{name:'Carlos', tag:null, correctTag:'red', treated:false, deteriorated:false}
    },
    sweepQueue:['p1','p2','p3'], sweepActive:null,
    treatQueue:[], treatActive:null,
    resourceRequest:null,
    score:{sceneSafety:100, triageAccuracy:100, prioritization:100, treatment:100, resources:100},
    log:[]
  };
}
let S = freshState();

function deduct(cat, amt, text){ S.score[cat]=Math.max(0,S.score[cat]-amt); S.log.push({ok:false,text}); }
function praise(text){ S.log.push({ok:true,text}); }
function showTempNote(text){
  const panel = M.querySelector('.panel-frame');
  if(!panel) return;
  const el = document.createElement('div');
  el.className = 'instr-note'; el.id = 'tnote-'+Date.now();
  el.innerHTML = text;
  panel.insertAdjacentElement('afterend', el);
  setTimeout(()=>{ el.remove(); }, 4200);
}

/* ============================================================
   PERSISTENCE
============================================================ */
function loadAllProg(){ try{ return JSON.parse(localStorage.getItem('cert_response_progress'))||{}; }catch(e){ return {}; } }
function loadProg(){ const all = loadAllProg(); return (all.issues && all.issues[ISSUE_KEY]) || {}; }
function saveProgress(pct, stars){
  const all = loadAllProg();
  all.issues = all.issues || {};
  const p = all.issues[ISSUE_KEY] || {};
  p.completed = true; p.plays = (p.plays||0)+1;
  if(!p.bestPct || pct>p.bestPct){ p.bestPct=pct; p.bestStars=stars; }
  all.issues[ISSUE_KEY] = p;
  localStorage.setItem('cert_response_progress', JSON.stringify(all));
}

/* ============================================================
   RENDER DISPATCH
============================================================ */
const M = document.getElementById('main');
function render(){ M.innerHTML = VIEWS[S.phase](); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- COVER ---------- */
function viewCover(){
  const p = loadProg();
  const best = p.bestPct ? `<p style="color:var(--gold);font-weight:700;">Best run: ${p.bestPct}% ${'★'.repeat(p.bestStars||0)}${'☆'.repeat(3-(p.bestStars||0))}</p>` : '';
  return `
    <div class="cover">
      <div class="num">ISSUE ${ISSUE.n}</div>
      <h2>${ISSUE.title}</h2>
      <p>A two-car collision outside a community event has left three people hurt. You can't treat all of them
         at once — the first job is figuring out who needs you first, not diving in on whoever you see first.</p>
      <div class="skill-row">${ISSUE.skills.map(s=>`<span class="skill-chip">${s}</span>`).join('')}</div>
      <p style="font-size:0.8rem;">${ISSUE.level}</p>
      ${best}
      <div class="btn-row"><button class="btn primary" onclick="SND.click();S=freshState();S.phase='establish';render()">▶ Begin Issue 04</button></div>
      <div class="btn-row"><a class="btn" href="game-response.html">📚 All Issues</a></div>
    </div>`;
}

/* ---------- ESTABLISH ---------- */
function viewEstablish(){
  return `
    <div class="panel-frame"><span class="issue-tag">ISSUE ${ISSUE.n}</span>${sceneEstablish()}</div>
    <div class="caption-box"><b>4:15 PM.</b> Dispatch: <i>"Two-vehicle collision, community fair parking lot,
      multiple people down. First CERT unit on scene, size up and report."</i> You're first in.</div>
    <div class="btn-row"><button class="btn primary" onclick="SND.click();S.phase='sizeup';render()">Approach the scene →</button></div>`;
}

/* ---------- HAZARD SWEEP ---------- */
function clickHotspot(id){
  if(S.phase==='sizeup'){
    if(S.activeHazard) return;
    if(id.startsWith('hazard-')){
      const key = id.slice(7);
      if(S.hazards[key].found) return;
      S.hazards[key].found = true; SND.good(); S.activeHazard = key;
      render(); return;
    }
    return;
  }
}
function sizeupHotspots(){
  return hotspot(690,50,40,'hazard-traffic',S.hazards.traffic.resolved,S.hintTarget==='hazard-traffic')
    + hotspot(330,370,36,'hazard-fuel',S.hazards.fuel.resolved,S.hintTarget==='hazard-fuel');
}
function viewSizeup(){
  if(S.activeHazard){
    const h = HAZARDS[S.activeHazard];
    return `
      <div class="panel-frame">${svgWrap(art('hazards', sceneHazardsInner()) + sizeupHotspots())}</div>
      <div class="caption-box"><b>Hazard found:</b> ${h.found}</div>
      <div class="opts">${h.choices.map((c,i)=>`<div class="opt" onclick="resolveHazard(${i})"><div class="n">${i+1}</div>${c.t}</div>`).join('')}</div>`;
  }
  const hs = sizeupHotspots();
  const ready = S.hazards.traffic.resolved && S.hazards.fuel.resolved;
  return `
    <div class="panel-frame">${svgWrap(art('hazards', sceneHazardsInner()) + hs)}</div>
    <div class="caption-box">Before you get to anyone, size up the scene itself. <b>Search for hazards</b>
      around the vehicles.</div>
    <div class="hint-row"><span class="pip"></span> ${ready ? 'Hazards addressed — you can begin triage.' : 'Something here needs your attention before you approach the patients.'}</div>
    <div class="btn-row">
      <button class="btn" onclick="hintCurrentPhase()">🔍 Hint</button>
      <button class="btn primary" ${ready?'':'disabled'} onclick="SND.click();S.phase='sweep';render()">Begin the triage sweep →</button>
    </div>`;
}
function sceneHazardsInner(){
  const bg = `${lotBase()}
    <ellipse cx="300" cy="358" rx="34" ry="8" fill="#1a1a1a" opacity=".7"/>
    <g stroke="#0a0e07" stroke-width="2" fill="#7fa8d8" opacity=".7">
      <polygon points="250,370 268,362 264,384 246,382"/>
    </g>
    <rect x="600" y="330" width="14" height="60" fill="#222" stroke="#0a0e07" stroke-width="3" transform="rotate(75 607 360)"/>
    <circle cx="640" cy="345" r="8" fill="#ffe680" opacity=".85"/>`;
  return bg;
}
function resolveHazard(i){
  const key = S.activeHazard, h = HAZARDS[key], c = h.choices[i];
  S.hazards[key].resolved = true;
  if(c.good){ SND.good(); praise(`Found and safely addressed: ${h.name.toLowerCase()}.`); }
  else { SND.bad(); deduct('sceneSafety', 12, c.note); }
  S.activeHazard = null;
  render();
}
function hintCurrentPhase(){
  SND.click();
  const remaining = ['hazard-traffic','hazard-fuel'].filter(id=>!S.hazards[id.slice(7)].resolved);
  if(!remaining.length) return;
  S.hintTarget = remaining[0];
  render();
  setTimeout(()=>{ if(S.phase==='sizeup'){ S.hintTarget=null; render(); } }, 2600);
}

/* ---------- TRIAGE SWEEP ---------- */
const RPM = {
  p1:{r:'16/min, easy', p:'Radial pulse present, skin normal', m:'Walking, talking, follows commands'},
  p2:{r:'20/min', p:'Radial pulse present, brisk cap refill', m:'Dazed but follows commands'},
  p3:{r:'32/min, shallow', p:'Radial pulse weak/hard to find', m:'Confused, slow to respond'}
};
function patientChips(){
  return `<div class="patient-strip">${Object.entries(S.patients).map(([k,p])=>
    `<div class="patient-chip"><span class="dot ${p.tag||'pending'}"></span>${p.name}</div>`).join('')}</div>`;
}
function viewSweep(){
  if(S.sweepActive){
    const key = S.sweepActive, p = S.patients[key], r = RPM[key];
    return `
      <div class="panel-frame">${scenePatientDetail(key)}</div>
      <div class="caption-box">Quick check on ${p.name} — Respiration, Pulse, Mental status. Not a full exam,
        just enough to tag.</div>
      <div class="notes-panel"><h4>Rapid RPM</h4><ul>
        <li><b>Respiration:</b> ${r.r}</li>
        <li><b>Perfusion:</b> ${r.p}</li>
        <li><b>Mental status:</b> ${r.m}</li>
      </ul></div>
      <div class="caption-box" style="margin-top:6px;">What's the tag?</div>
      <div class="tag-row">
        <button class="tag-btn green" onclick="tagPatient('green')">🟢 Minor</button>
        <button class="tag-btn yellow" onclick="tagPatient('yellow')">🟡 Delayed</button>
        <button class="tag-btn red" onclick="tagPatient('red')">🔴 Immediate</button>
      </div>`;
  }
  if(S.sweepQueue.length){
    const key = S.sweepQueue[0];
    return `
      <div class="panel-frame">${sceneOverview({p1:S.patients.p1.tag,p2:S.patients.p2.tag,p3:S.patients.p3.tag})}</div>
      <div class="caption-box">Three patients, no time to fully assess any one of them yet. This is a <b>sweep</b>
        — a quick RPM check on each, tag, and move on. Full treatment comes after.</div>
      ${patientChips()}
      <div class="btn-row"><button class="btn primary" onclick="SND.click();S.sweepActive='${key}';render()">Check on ${S.patients[key].name} →</button></div>`;
  }
  return viewSweepDone();
}
function tagPatient(tag){
  const key = S.sweepActive, p = S.patients[key];
  p.tag = tag; SND.click();
  if(tag===p.correctTag){ praise(`Tagged ${p.name} ${tag.toUpperCase()} — correct.`); }
  else {
    deduct('triageAccuracy', 18, `Tagged ${p.name} ${tag.toUpperCase()}, but their RPM signs matched ${p.correctTag.toUpperCase()} — a mistag here delays the care they actually need.`);
    SND.bad();
    if(key==='p3') S.patients.p3.deteriorated = true;
  }
  S.sweepQueue = S.sweepQueue.slice(1);
  S.sweepActive = null;
  render();
}
function viewSweepDone(){
  praise('Completed the triage sweep on all three patients before starting hands-on treatment.');
  // build treat queue in true priority order regardless of how they were tagged, so mistagging has a real cost during treatment
  S.treatQueue = ['p3','p2','p1'];
  return `
    <div class="panel-frame">${sceneOverview({p1:S.patients.p1.tag,p2:S.patients.p2.tag,p3:S.patients.p3.tag})}</div>
    <div class="caption-box">Sweep complete. Now it's time to actually treat them — starting with whoever needs
      you most.</div>
    ${patientChips()}
    <div class="btn-row"><button class="btn primary" onclick="SND.click();S.phase='treatment';render()">Begin treatment →</button></div>`;
}

/* ---------- TREATMENT (priority order) ---------- */
const TREAT_OPTIONS = {
  p3:[
    {id:'airway', t:"Open his airway, reposition him, and watch his breathing closely", good:true},
    {id:'shock3', t:'Treat for shock and keep him warm', good:true},
    {id:'history3', t:'Start a full detailed history before doing anything else', good:false,
      note:'A confused, fast-breathing patient with a weak pulse needs airway and shock management first — a full history can wait.'}
  ],
  p2:[
    {id:'pressure2', t:'Control her forehead laceration with direct pressure and a bandage', good:true},
    {id:'reassure2', t:'Reassure her and keep her still while you work', good:true},
    {id:'skip2', t:"She's stable, skip her for now and check on Jake instead", good:false,
      note:"Renee is Delayed, not Minor — she still needs care before Jake, who's ambulatory and lowest priority."}
  ],
  p1:[
    {id:'bandage1', t:'Clean and bandage his minor scrape', good:true},
    {id:'wait1', t:'Have him sit and wait — he can hold until the others are handled', good:true},
    {id:'over1', t:'Give him a full head-to-toe exam and detailed history first', good:false,
      note:"Jake is walking and stable — spending extended time on a Minor patient while others are more urgent is a prioritization mistake, even though he's friendly and easy to talk to."}
  ]
};
function viewTreatment(){
  if(!S.treatQueue.length){ S.phase='resources'; return VIEWS['resources'](); }
  const key = S.treatQueue[0];
  const p = S.patients[key];
  const opts = TREAT_OPTIONS[key];
  const list = opts.map((t,i)=>{
    const done = S.patients[key][t.id];
    return `<div class="opt ${done?'done':''}" onclick="${done?'':`pickTreatment('${key}','${t.id}')`}"><div class="n">${done?'✓':i+1}</div>${t.t}</div>`;
  }).join('');
  const coreGiven = opts.filter(t=>t.good).every(t=>S.patients[key][t.id]);
  return `
    <div class="panel-frame">${scenePatientDetail(key, p.tag==='red'?'#ef4444':p.tag==='yellow'?'#e8c33a':'#5aaa3a')}</div>
    <div class="caption-box">Now treating <b>${p.name}</b> (${p.tag?p.tag.toUpperCase():'untagged'}).</div>
    ${patientChips()}
    <div class="opts">${list}</div>
    <div class="btn-row"><button class="btn primary" ${coreGiven?'':'disabled'} onclick="finishPatientTreatment()">Continue →</button></div>`;
}
function pickTreatment(key, id){
  const t = TREAT_OPTIONS[key].find(x=>x.id===id);
  if(t.good){ S.patients[key][id]=true; SND.good(); praise(t.t+' — '+S.patients[key].name+'.'); render(); return; }
  SND.bad(); deduct('prioritization', 15, t.note);
  if(key==='p3') S.patients.p3.deteriorated = true;
  M.querySelector('.panel-frame').insertAdjacentHTML('afterend',
    `<div class="instr-note" id="tnote"><b>Not quite:</b> ${t.note}</div>`);
  setTimeout(()=>{ const n=document.getElementById('tnote'); if(n) n.remove(); }, 4200);
}
function finishPatientTreatment(){
  const key = S.treatQueue[0];
  S.patients[key].treated = true;
  S.treatQueue = S.treatQueue.slice(1);
  if(S.treatQueue.length){ render(); return; }
  S.phase='resources'; render();
}

/* ---------- RESOURCES ---------- */
function viewResources(){
  return `
    <div class="panel-frame">${sceneOverview({p1:S.patients.p1.tag,p2:S.patients.p2.tag,p3:S.patients.p3.tag})}</div>
    <div class="caption-box">Time to radio Command. What do you request?</div>
    <div class="opts">
      <div class="opt" onclick="pickResource('one')"><div class="n">1</div>One ambulance — that should cover it</div>
      <div class="opt" onclick="pickResource('full')"><div class="n">2</div>Enough transport for all three, flag the Red patient as priority</div>
      <div class="opt" onclick="pickResource('none')"><div class="n">3</div>Handle it with just your CERT team — no need for EMS</div>
    </div>`;
}
function pickResource(pick){
  S.resourceRequest = pick;
  if(pick==='full'){ SND.good(); praise('Requested transport for all three patients and flagged the Immediate patient as priority — the right call.'); }
  else if(pick==='one'){ SND.bad(); deduct('resources', 25, 'One ambulance for three patients, including a Red tag, is not enough — under-requesting resources leaves people waiting who shouldn\'t have to.'); }
  else { SND.bad(); deduct('resources', 35, 'A Red-tagged patient with breathing and perfusion concerns is well beyond CERT scope — this always needs EMS.'); }
  S.phase='outcome'; render();
}

/* ---------- OUTCOME ---------- */
function viewOutcome(){
  const correctTags = Object.values(S.patients).filter(p=>p.tag===p.correctTag).length;
  const good = correctTags===3 && S.resourceRequest==='full';
  const text = good
    ? "EMS arrives to a scene that's already organized: three patients correctly tagged, treated in the right order, and a clear picture of who needs what waiting for them. Carlos goes out first. Jake, still waiting patiently with his bandaged arm, gives you a thumbs up as they load the others. Textbook."
    : "EMS arrives and sorts out the rest. Everyone makes it, but the scene took longer to stabilize than it should have — some of the mistakes here cost time that a real multi-casualty incident wouldn't forgive as easily.";
  return `
    <div class="panel-frame">${sceneOutcome()}</div>
    <div class="caption-box"><b>A few minutes later.</b> ${text}</div>
    <div class="btn-row"><button class="btn primary" onclick="SND.win();showDebrief()">See your debrief →</button></div>`;
}

/* ---------- DEBRIEF ---------- */
function showDebrief(){
  const cats = S.score;
  const pct = Math.round(Object.values(cats).reduce((a,b)=>a+b,0)/Object.keys(cats).length);
  const stars = pct>=90?3:pct>=70?2:1;
  saveProgress(pct, stars);
  S.phase='debrief'; S._pct=pct; S._stars=stars;
  render();
}
function viewDebrief(){
  const pct = S._pct, stars = S._stars;
  const rows = Object.entries(S.score).map(([k,v])=>{
    const lbl = {sceneSafety:'Scene Safety',triageAccuracy:'Triage Accuracy',prioritization:'Prioritization',
      treatment:'Treatment',resources:'Resources'}[k];
    return `<div class="score-item"><div class="lbl">${lbl}</div><div class="val">${Math.round(v)}%</div></div>`;
  }).join('');
  const good = S.log.filter(l=>l.ok).map(l=>`<div class="check-item ok"><span class="ic">✓</span>${l.text}</div>`).join('');
  const warn = S.log.filter(l=>!l.ok).map(l=>`<div class="check-item warn"><span class="ic">⚠</span>${l.text}</div>`).join('');
  return `
    <div class="card">
      <h3>Debrief — Issue ${ISSUE.n}: ${ISSUE.title}</h3>
      <div class="overall"><div class="pct">${pct}%</div><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div></div>
      <div class="score-grid">${rows}</div>
      <div class="check-list">${good}${warn}</div>
      <div class="btn-row">
        <button class="btn primary" onclick="SND.click();S=freshState();S.phase='establish';render()">↻ Replay Issue 04</button>
        <a class="btn" href="game-response.html">📚 All Issues</a>
      </div>
    </div>`;
}

/* ============================================================
   VIEW TABLE + BOOT
============================================================ */
const VIEWS = {
  cover: viewCover, establish: viewEstablish, sizeup: viewSizeup, sweep: viewSweep,
  treatment: viewTreatment, resources: viewResources, outcome: viewOutcome, debrief: viewDebrief
};

SND.init();
render();
</script>
</body>
</html>
