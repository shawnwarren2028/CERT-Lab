<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallingford CERT — Reference Viewer</title>
<meta name="description" content="In-site viewer for the FEMA CERT Basic Training course decks, Sections 1 to 8.">
<meta name="theme-color" content="#5aaa3a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wallingford CERT Training Suite">
<meta property="og:title" content="Wallingford CERT — Reference Viewer">
<meta property="og:description" content="In-site viewer for the FEMA CERT Basic Training course decks, Sections 1 to 8.">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Wallingford CERT — Reference Viewer">
<meta name="twitter:description" content="In-site viewer for the FEMA CERT Basic Training course decks, Sections 1 to 8.">
<style>
  :root{
    --bg:#0e1208; --surface:#1a2012; --surface2:#243018; --border:#3a5228;
    --primary:#5aaa3a; --primary-dark:#4a8f2e; --primary-light:#7ac95a;
    --text:#eef2e8; --text-muted:#8aa87a; --radius:12px;
  }
  [data-theme="light"]{
    --bg:#eef3e7; --surface:#ffffff; --surface2:#e7eedd; --border:#c2d2af;
    --primary:#41902e; --primary-dark:#317022; --primary-light:#5aaa3a;
    --text:#16210d; --text-muted:#5c6e4a; --muted:#5c6e4a;
  }
  [data-theme="light"] header{background:#e3ecd6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  header{width:100%;background:#111a09;border-bottom:3px solid var(--primary);
    padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0;}
  #cert-logo{height:48px;width:auto;}
  .logo-badge{background:var(--primary);color:#000;font-weight:900;font-size:1.05rem;
    letter-spacing:.1em;padding:6px 12px;border-radius:6px;}
  header h1{font-size:1.12rem;font-weight:700;color:var(--primary);}
  header p{font-size:0.76rem;color:var(--text-muted);}
  .hdr-text{flex:1 1 0;min-width:0;}
  .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .home-link{color:var(--primary-light);text-decoration:none;font-size:0.85rem;font-weight:600;
    border:1px solid var(--border);padding:8px 15px;border-radius:8px;transition:.15s;white-space:nowrap;}
  .home-link:hover{background:var(--surface2);border-color:var(--primary);}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);
    border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
  .tb-title{font-weight:700;color:var(--primary);font-size:1rem;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-sub{font-size:0.74rem;color:var(--text-muted);}
  .tb-spacer{flex:1 1 auto;}
  .tb-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:0.82rem;
    font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .tb-btn:hover:not(:disabled){border-color:var(--primary);background:var(--border);}
  .tb-btn:disabled{opacity:.4;cursor:default;}
  .tb-btn.primary{color:var(--primary-light);}

  /* viewer area */
  .stage{flex:1;min-height:0;position:relative;background:var(--bg);}
  #frame{width:100%;height:100%;border:0;background:#333;}
  .note{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;
    background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
    font-size:0.74rem;padding:5px 12px;border-radius:20px;max-width:92%;text-align:center;}
  .fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:24px;}
  .fallback.on{display:flex;}
  .fallback .fb-ic{font-size:2.6rem;}
  .fallback h2{font-size:1.15rem;color:var(--primary);}
  .fallback p{font-size:0.9rem;color:var(--text-muted);max-width:440px;line-height:1.55;}
  .fallback .fb-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  @media (max-width:600px){
    header{padding:8px 14px;}
    .hdr-actions{margin-left:0;width:100%;justify-content:center;}
    .toolbar{padding:8px 12px;gap:8px;}
    .tb-title{width:100%;}
    .tb-btn{font-size:0.78rem;padding:8px 11px;}
  }
</style>
</head>
<body>

<header>
  <img id="cert-logo" src="cert-wallingford-logo.png" alt="Wallingford CERT"
    onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
  <div id="logo-fallback" style="display:none;align-items:center;"><div class="logo-badge">CERT</div></div>
  <div class="hdr-text">
    <h1>Wallingford CERT — Course Reference</h1>
    <p>Community Emergency Response Team</p>
  </div>
  <div class="hdr-actions">
    <a class="home-link" href="reference.html">← Materials</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle light or dark mode">☀️</button>
  </div>
</header>

<div class="toolbar">
  <button class="tb-btn" id="prev-btn" title="Previous section">‹ Prev</button>
  <div>
    <div class="tb-title" id="sec-title">Loading…</div>
    <div class="tb-sub" id="sec-sub"></div>
  </div>
  <button class="tb-btn" id="next-btn" title="Next section">Next ›</button>
  <div class="tb-spacer"></div>
  <a class="tb-btn primary" id="open-tab" target="_blank" rel="noopener">↗ Open in new tab</a>
  <a class="tb-btn" id="download-pdf" download>⭳ PDF</a>
  <a class="tb-btn" id="download-btn" download>⭳ PPTX</a>
</div>

<div class="stage">
  <div class="note" id="note" style="display:none"></div>
  <iframe id="frame" title="Presentation"></iframe>
  <div class="fallback" id="fallback">
    <div class="fb-ic">📊</div>
    <h2 id="fb-title">Preview unavailable</h2>
    <p id="fb-msg">This presentation couldn't be shown inline on your device. Use the options below.</p>
    <div class="fb-row">
      <a class="tb-btn primary" id="fb-open" target="_blank" rel="noopener">↗ Open in a new tab</a>
      <a class="tb-btn" id="fb-download" download>⭳ Download .pptx</a>
      <a class="tb-btn" href="reference.html">← Back to Materials</a>
    </div>
  </div>
</div>

<script src="reference-sections.js"></script>
<script>
const params = new URLSearchParams(location.search);
const docBase = params.get('doc');
const idx = REF_SECTIONS.findIndex(s => s.base === docBase);
const sec = idx >= 0 ? REF_SECTIONS[idx] : null;

const $ = id => document.getElementById(id);

function absUrl(rel){ return new URL(rel, location.href).href; }
function officeEmbed(pptxRel){
  return 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absUrl(pptxRel));
}

async function init(){
  if (!sec){
    $('sec-title').textContent = 'Section not found';
    $('fallback').classList.add('on');
    $('fb-title').textContent = 'Section not found';
    $('fb-msg').textContent = 'Pick a section from the Course Materials page.';
    $('fb-open').style.display = 'none'; $('fb-download').style.display = 'none';
    return;
  }
  document.title = 'Wallingford CERT — ' + sec.name;
  $('sec-title').textContent = sec.name;
  $('sec-sub').textContent = 'Section ' + sec.n + ' of ' + REF_SECTIONS.length;

  const pptx = sec.base + '.pptx';
  const pdf  = sec.base + '.pdf';
  $('download-pdf').href = pdf;
  $('download-btn').href = pptx;
  $('fb-download').href = pptx;

  // Prev / Next
  const prev = REF_SECTIONS[idx - 1], next = REF_SECTIONS[idx + 1];
  if (prev) $('prev-btn').onclick = () => location.href = 'viewer.html?doc=' + prev.base;
  else $('prev-btn').disabled = true;
  if (next) $('next-btn').onclick = () => location.href = 'viewer.html?doc=' + next.base;
  else $('next-btn').disabled = true;

  // Prefer a self-hosted PDF (offline, themed); fall back to the online Office viewer.
  let usePdf = false;
  try { const r = await fetch(pdf, { method: 'HEAD' }); usePdf = r.ok; } catch (e) { usePdf = false; }

  const slide = parseInt(params.get('slide'), 10);
  const page = (slide > 0) ? slide : 1;
  if (usePdf){
    const frag = '#page=' + page + '&toolbar=1&navpanes=0&view=FitH';
    $('frame').src = pdf + frag;
    $('open-tab').href = pdf + frag; $('fb-open').href = pdf + frag;
  } else {
    $('frame').src = officeEmbed(pptx);
    $('open-tab').href = officeEmbed(pptx); $('fb-open').href = officeEmbed(pptx);
    const note = $('note');
    note.textContent = 'Online preview (Microsoft Office viewer) — needs an internet connection';
    note.style.display = 'block';
  }

  // If nothing renders after a while, reveal the fallback options.
  let loaded = false;
  $('frame').addEventListener('load', () => { loaded = true; });
  setTimeout(() => { if (!loaded) $('fallback').classList.add('on'); }, 9000);
}
init();
</script>
</body>
</html>
