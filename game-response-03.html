<style>
  :root{
    --bg:#0e1208; --surface:#1a2012; --surface2:#243018; --border:#3a5228;
    --primary:#5aaa3a; --primary-dark:#4a8f2e; --primary-light:#7ac95a;
    --text:#eef2e8; --text-muted:#8aa87a; --radius:12px; --gold:#e8c33a;
    --danger:#ef4444; --warn:#f59e0b; --min:#27ae60;
  }
  [data-theme="light"]{
    --bg:#eef3e7; --surface:#ffffff; --surface2:#e7eedd; --border:#c2d2af;
    --primary:#41902e; --primary-dark:#317022; --primary-light:#5aaa3a;
    --text:#16210d; --text-muted:#5c6e4a; --muted:#5c6e4a;
  }
  [data-theme="light"] header{background:#e3ecd6;}
  [data-theme="light"] footer{background:#e3ecd6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;}

  header{width:100%;background:#111a09;border-bottom:3px solid var(--primary);
    padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  #cert-logo{height:48px;width:auto;}
  .logo-badge{background:var(--primary);color:#000;font-weight:900;font-size:1.05rem;letter-spacing:.1em;padding:6px 12px;border-radius:6px;}
  header h1{font-size:1.12rem;font-weight:700;color:var(--primary);}
  header p{font-size:0.76rem;color:var(--text-muted);}
  .hdr-text{flex:1 1 0;min-width:0;}
  .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:9px;}
  .home-link{color:var(--primary-light);text-decoration:none;font-size:0.85rem;font-weight:600;
    border:1px solid var(--border);padding:8px 14px;border-radius:8px;transition:.15s;white-space:nowrap;}
  .home-link:hover{background:var(--surface2);border-color:var(--primary);}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;line-height:1;
    padding:8px 11px;border-radius:8px;cursor:pointer;transition:.15s;}
  .icon-btn:hover{border-color:var(--primary);}

  main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:16px 18px 26px;display:flex;flex-direction:column;gap:14px;}

  .panel-frame{position:relative;border:3px solid #0a0e07;border-radius:6px;overflow:hidden;
    background:#0a0e07 radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.4px) 0 0/14px 14px;
    box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);}
  [data-theme="light"] .panel-frame{border-color:#1a1a1a;}
  svg.scene{display:block;width:100%;height:auto;}
  .issue-tag{position:absolute;top:10px;left:10px;background:var(--gold);color:#1a1400;font-weight:900;
    font-size:0.68rem;letter-spacing:.06em;padding:4px 9px;border-radius:4px;transform:rotate(-2deg);
    box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2;}

  .caption-box{background:#f4ecd2;color:#1a1608;border:2px solid #1a1608;border-radius:2px;
    padding:10px 14px;font-size:0.92rem;font-weight:600;line-height:1.5;margin:-3px 12px 0;
    box-shadow:0 4px 10px rgba(0,0,0,.35);position:relative;z-index:2;font-family:Georgia,'Times New Roman',serif;}
  .caption-box b{color:#7a1010;}

  .speech-wrap{display:flex;gap:10px;align-items:flex-start;margin:2px 4px 0;}
  .speech-bubble{background:#fff;color:#111;border:2px solid #111;border-radius:16px;padding:10px 16px;
    font-size:0.92rem;font-weight:600;line-height:1.45;position:relative;max-width:520px;box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .speech-bubble::before{content:'';position:absolute;top:-2px;left:26px;width:16px;height:16px;background:#fff;
    border-left:2px solid #111;border-top:2px solid #111;transform:rotate(45deg) translateY(-8px);}
  .speech-name{font-size:0.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-light);
    margin-bottom:6px;}

  .hint-row{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--text-muted);padding:2px 4px;}
  .hint-row .pip{width:9px;height:9px;border-radius:50%;background:var(--gold);flex-shrink:0;
    box-shadow:0 0 6px var(--gold);animation:pip 1.4s ease-in-out infinite;}
  @keyframes pip{0%,100%{opacity:.5}50%{opacity:1}}

  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-size:0.92rem;font-weight:600;padding:12px 14px;border-radius:10px;cursor:pointer;transition:.14s;
    font-family:inherit;}
  .opt:hover{border-color:var(--primary);background:var(--border);}
  .opt.done{opacity:.55;border-color:var(--min);cursor:default;}
  .opt .n{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;flex-shrink:0;}

  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:0.92rem;font-weight:700;
    padding:12px 20px;border-radius:9px;cursor:pointer;transition:.15s;font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;justify-content:center;}
  .btn:hover{border-color:var(--primary);background:var(--border);}
  .btn.primary{background:var(--primary);color:#06210a;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-light);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

  .notes-panel{background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;}
  .notes-panel h4{font-size:0.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
  .notes-panel ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .notes-panel li{font-size:0.84rem;color:var(--text);}

  .cover{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;text-align:center;}
  .cover .num{color:var(--gold);font-weight:900;letter-spacing:.15em;font-size:0.78rem;}
  .cover h2{font-size:1.7rem;font-weight:900;color:var(--primary);margin:6px 0 10px;letter-spacing:.02em;}
  .cover p{color:var(--text-muted);font-size:0.92rem;max-width:520px;margin:0 auto 14px;line-height:1.55;}
  .skill-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:16px;}
  .skill-chip{font-size:0.74rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;
    padding:5px 11px;color:var(--text);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card h3{font-size:1.05rem;color:var(--primary);margin-bottom:6px;}
  .card p{font-size:0.88rem;color:var(--text-muted);line-height:1.5;}

  .score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0;}
  .score-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .score-item .lbl{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .score-item .val{font-size:1.3rem;font-weight:800;color:var(--primary);}
  .overall{text-align:center;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;}
  .overall .pct{font-size:2.4rem;font-weight:900;color:var(--gold);}
  .overall .stars{font-size:1.3rem;letter-spacing:.1em;}

  .check-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 16px;}
  .check-item{display:flex;gap:9px;align-items:flex-start;font-size:0.86rem;background:var(--bg);
    border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
  .check-item .ic{flex-shrink:0;}
  .check-item.ok .ic{color:var(--min);} .check-item.warn .ic{color:var(--warn);}
  .instr-note{background:var(--surface2);border-left:3px solid var(--gold);border-radius:6px;padding:10px 13px;
    font-size:0.84rem;color:var(--text);margin-top:6px;}
  .instr-note b{color:var(--gold);}

  footer{text-align:center;padding:16px;color:var(--text-muted);font-size:0.74rem;border-top:1px solid var(--border);}
  footer span{color:var(--primary);}
</style>
</head>
<body>

<header>
  <img id="cert-logo" src="readiness-arcade-logo.png" alt="Readiness Arcade"
    onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
  <div id="logo-fallback" style="display:none;align-items:center;"><div class="logo-badge">RA</div></div>
  <div class="hdr-text">
    <h1>Field Response</h1>
    <p>Issue 03 · The Community Center</p>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn" id="sfx-btn" onclick="SND.toggle()" title="Sound effects">🔊</button>
    <a class="home-link" href="game-response.html">← Issues</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle light or dark mode">☀️</button>
  </div>
</header>

<main id="main"></main>

<footer><span>Readiness Arcade</span> · Field Response · For educational use, this is not medical advice. If a true emergency contact 911 or your local EMS — follow your local CERT program guidelines.</footer>

<script>
/* ============================================================
   SFX
============================================================ */
const SND=(function(){
  let ctx,on=(localStorage.getItem('cert_response_sfx')!=='off'),comp;
  function ac(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); comp=ctx.createDynamicsCompressor(); comp.connect(ctx.destination);} return ctx; }
  function tone(f,t,type,g,dur){ if(!on)return; ac(); const o=ctx.createOscillator(),ga=ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,ctx.currentTime+t);
    ga.gain.setValueAtTime(0,ctx.currentTime+t); ga.gain.linearRampToValueAtTime(g||.2,ctx.currentTime+t+.01);
    ga.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+(dur||.2));
    o.connect(ga); ga.connect(comp); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+(dur||.2)+.02); }
  return {
    click(){ tone(520,0,'square',.12,.06); },
    good(){ tone(660,0,'sine',.18,.12); tone(880,.08,'sine',.16,.16); },
    bad(){ tone(220,0,'sawtooth',.16,.22); },
    win(){ tone(523,0,'sine',.18,.14); tone(659,.1,'sine',.18,.14); tone(784,.2,'sine',.2,.3); },
    toggle(){ on=!on; localStorage.setItem('cert_response_sfx',on?'on':'off'); document.getElementById('sfx-btn').textContent=on?'🔊':'🔇'; if(on){ac();this.click();} },
    init(){ document.getElementById('sfx-btn').textContent=on?'🔊':'🔇'; }
  };
})();

/* ============================================================
   ART SWAP-IN POINT
============================================================ */
const PANEL_ART = {
  briefing:  'response-issue03-briefing.png',
  establish: 'response-issue03-establish.png',
  cluehunt:  'response-issue03-cluehunt.png',
  patient_unwell:       'response-issue03-patient-unwell.png',
  patient_recovering:   'response-issue03-patient-recovering.png',
  patient_deteriorated: 'response-issue03-patient-deteriorated.png',
};

/* ============================================================
   SCENE RENDERING — comic-ink vector art
============================================================ */
const DEFS = `
  <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ffd98a" stop-opacity=".5"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
  </radialGradient>`;

function hotspot(x,y,r,id,found,pulse){
  if(found){
    return `<g class="hotspot" onclick="clickHotspot('${id}')" style="cursor:pointer" pointer-events="all">
      <circle cx="${x}" cy="${y}" r="${r}" fill="rgba(90,170,58,.15)" stroke="#5aaa3a" stroke-width="2.5"/>
      <path d="M${x-r*0.4} ${y} l${r*0.28} ${r*0.28} l${r*0.5} -${r*0.55}" stroke="#5aaa3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;
  }
  const hitR = Math.round(r*0.55);
  return `<g class="hotspot" onclick="clickHotspot('${id}')" style="cursor:pointer" pointer-events="all">
    <circle cx="${x}" cy="${y}" r="${hitR}" fill="transparent" stroke="${pulse?'#e8c33a':'none'}" stroke-width="2" ${pulse?'filter="url(#hglow)"':''}/>
    <circle cx="${x}" cy="${y}" r="2.5" fill="${pulse?'#e8c33a':'rgba(232,195,58,.5)'}"/>
  </g>`;
}
function svgWrap(inner){
  return `<svg class="scene" viewBox="0 0 800 533" xmlns="http://www.w3.org/2000/svg"><defs>${DEFS}</defs>${inner}</svg>`;
}
function art(key, fallback){
  if(PANEL_ART[key]) return `<image href="${PANEL_ART[key]}" x="0" y="0" width="800" height="533" preserveAspectRatio="xMidYMid slice"/>`;
  return fallback;
}

function shelterBase(){
  return `
    <rect width="800" height="533" fill="#141a10"/>
    <rect x="0" y="0" width="800" height="140" fill="#0e130b"/>
    <g opacity=".8">
      ${[80,200,320,560,680].map(x=>`<rect x="${x}" y="330" width="90" height="34" rx="6" fill="#3a4038" stroke="#0a0e07" stroke-width="3"/>`).join('')}
      ${[80,200,560,680].map(x=>`<circle cx="${x+45}" cy="322" r="10" fill="#8a8478" stroke="#0a0e07" stroke-width="2"/>`).join('')}
    </g>
    <circle cx="400" cy="90" r="60" fill="url(#lantern)"/>
    <rect x="392" y="60" width="16" height="14" fill="#333" stroke="#0a0e07" stroke-width="2"/>
    <circle cx="400" cy="95" r="14" fill="#ffe9b0" opacity=".9"/>`;
}

function sceneBriefing(){
  const bg = `
    ${shelterBase()}
    <g>
      <rect x="330" y="360" width="16" height="40" rx="3" fill="#8a7860" stroke="#0a0e07" stroke-width="3"/>
      <circle cx="338" cy="350" r="11" fill="#c9b090" stroke="#0a0e07" stroke-width="3"/>
    </g>
    <g>
      <rect x="380" y="362" width="16" height="42" rx="3" fill="#3a5228" stroke="#0a0e07" stroke-width="3"/>
      <circle cx="388" cy="350" r="11" fill="#5aaa3a" stroke="#0a0e07" stroke-width="3"/>
    </g>
    <rect x="560" y="330" width="90" height="34" rx="6" fill="#3a4038" stroke="#0a0e07" stroke-width="3"/>
    <circle cx="605" cy="322" r="10" fill="#8a8478" stroke="#0a0e07" stroke-width="2"/>`;
  return svgWrap(art('briefing', bg));
}

function sceneEstablish(){
  const bg = `${shelterBase()}
    <g opacity=".7">
      <rect x="150" y="360" width="90" height="34" rx="6" fill="#3a4038" stroke="#0a0e07" stroke-width="3"/>
      <circle cx="195" cy="352" r="9" fill="#8a8478" stroke="#0a0e07" stroke-width="2"/>
    </g>`;
  return svgWrap(art('establish', bg));
}

function sceneCluehunt(hs){
  const bg = `
    <rect width="800" height="533" fill="#141a10"/>
    <rect x="0" y="0" width="800" height="140" fill="#0e130b"/>
    <circle cx="400" cy="90" r="70" fill="url(#lantern)"/>
    <circle cx="400" cy="95" r="14" fill="#ffe9b0" opacity=".9"/>
    <rect x="230" y="330" width="340" height="42" rx="8" fill="#3a4038" stroke="#0a0e07" stroke-width="4"/>
    <rect x="250" y="300" width="90" height="40" rx="6" fill="#5a4a38" stroke="#0a0e07" stroke-width="3" transform="rotate(-4 295 320)"/>
    <ellipse cx="420" cy="310" rx="26" ry="16" fill="#e8c33a" opacity=".85"/>
    <rect x="480" y="295" width="30" height="46" rx="4" fill="#c94040" stroke="#0a0e07" stroke-width="3"/>`;
  return svgWrap(art('cluehunt', bg) + (hs||''));
}

function patientFigure(stage){
  const skin = stage==='deteriorated' ? '#b7c9a8' : '#d9b48a';
  const faceMouth = stage==='recovering' ? `<path d="M468 300 q10 5 20 0" stroke="#3a2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : stage==='deteriorated' ? `<ellipse cx="478" cy="302" rx="7" ry="4" fill="#3a2a1a" opacity=".6"/>`
    : `<path d="M468 302 q10 3 20 0" stroke="#3a2a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const sweat = stage!=='recovering' ? `<ellipse cx="498" cy="268" rx="3" ry="6" fill="#cfe8ff" opacity=".75"/><ellipse cx="452" cy="276" rx="3" ry="6" fill="#cfe8ff" opacity=".7"/>` : '';
  const hand = stage==='recovering' ? `<rect x="430" y="330" width="46" height="16" rx="6" fill="#e8c33a" opacity=".85" transform="rotate(-6 453 338)"/>` : '';
  return `
    <g>
      <!-- cot -->
      <rect x="380" y="360" width="220" height="20" rx="4" fill="#3a4038" stroke="#0a0e07" stroke-width="3"/>
      <!-- torso, sitting/lying -->
      <path d="M410 300 q60 -20 120 0 l0 70 q-60 16 -120 0 z" fill="#6a5a48" stroke="#0a0e07" stroke-width="4"/>
      <!-- arms -->
      <path d="M405 320 q-20 10 -25 30" stroke="${skin}" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M535 320 q20 10 25 30" stroke="${skin}" stroke-width="16" fill="none" stroke-linecap="round"/>
      ${hand}
      <!-- head -->
      <circle cx="470" cy="278" r="32" fill="${skin}" stroke="#0a0e07" stroke-width="4"/>
      <path d="M444 262 q26 -30 52 -6 q2 -18 -12 -26 q-26 -8 -42 10 q-6 8 2 22" fill="#9a9a9a" stroke="#0a0e07" stroke-width="3"/>
      <circle cx="459" cy="280" r="3.2" fill="#2a1c10"/><circle cx="483" cy="280" r="3.2" fill="#2a1c10"/>
      ${faceMouth}${sweat}
    </g>`;
}
function scenePatient(stage, hs){
  const bg = `${shelterBase()}` + patientFigure(stage);
  return svgWrap(art('patient_'+stage, bg) + (hs||''));
}

/* ============================================================
   STATE
============================================================ */
const ISSUE = {n:'03', title:'THE COMMUNITY CENTER', level:'Level 1 — Basic',
  skills:['Patient History','Diagnosis','Mental Status']};
const ISSUE_KEY = '03';

const CLUES = {
  medkit: 'A small diabetes testing kit and a strip of glucose tablets sit in her open tote bag.',
  juice: 'A small juice box lies on its side, mostly empty — looks like she was trying to drink it.',
  granola: 'A granola bar wrapper, half-eaten, sits on the cot beside her.',
  photo: 'A small family photo tucked in her bag. Not medically relevant, but it tells you she was in a hurry when she packed.'
};
const PRIMARY_REACTIONS = {
  'chk-orient': '"...wh- what? Sorry, I\'m a little... foggy."',
  'chk-skin': '"I know, I\'m soaked. I don\'t know why."',
  'chk-breathing': '"My heart\'s racing a bit. I feel shaky."'
};

function freshState(){
  return {
    phase:'cover',
    clues:{medkit:false, juice:false, granola:false, photo:false},
    hintTarget:null,
    checks:{orient:false, skin:false, breathing:false},
    lastFinding:null,
    asked:{}, lastAsked:null,
    given:{}, mistakes:0,
    stage:'unwell',
    dispositionPick:null,
    score:{assessment:100, prioritization:100, communication:100, treatment:100, reassessment:100},
    log:[]
  };
}
let S = freshState();

function deduct(cat, amt, text){ S.score[cat]=Math.max(0,S.score[cat]-amt); S.log.push({ok:false,text}); }
function praise(text){ S.log.push({ok:true,text}); }
function showTempNote(text){
  const panel = M.querySelector('.panel-frame');
  if(!panel) return;
  const el = document.createElement('div');
  el.className = 'instr-note'; el.id = 'tnote-'+Date.now();
  el.innerHTML = text;
  panel.insertAdjacentElement('afterend', el);
  setTimeout(()=>{ el.remove(); }, 4200);
}

/* ============================================================
   PERSISTENCE
============================================================ */
function loadAllProg(){ try{ return JSON.parse(localStorage.getItem('cert_response_progress'))||{}; }catch(e){ return {}; } }
function loadProg(){ const all = loadAllProg(); return (all.issues && all.issues[ISSUE_KEY]) || {}; }
function saveProgress(pct, stars){
  const all = loadAllProg();
  all.issues = all.issues || {};
  const p = all.issues[ISSUE_KEY] || {};
  p.completed = true; p.plays = (p.plays||0)+1;
  if(!p.bestPct || pct>p.bestPct){ p.bestPct=pct; p.bestStars=stars; }
  all.issues[ISSUE_KEY] = p;
  localStorage.setItem('cert_response_progress', JSON.stringify(all));
}

/* ============================================================
   RENDER DISPATCH
============================================================ */
const M = document.getElementById('main');
function render(){ M.innerHTML = VIEWS[S.phase](); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- COVER ---------- */
function viewCover(){
  const p = loadProg();
  const best = p.bestPct ? `<p style="color:var(--gold);font-weight:700;">Best run: ${p.bestPct}% ${'★'.repeat(p.bestStars||0)}${'☆'.repeat(3-(p.bestStars||0))}</p>` : '';
  return `
    <div class="cover">
      <div class="num">ISSUE ${ISSUE.n}</div>
      <h2>${ISSUE.title}</h2>
      <p>No explosion, no collapse — just a warm, dim shelter and a woman who suddenly doesn't seem right.
         Everything you need to figure out what's wrong is right here, if you look for it and ask the right
         questions.</p>
      <div class="skill-row">${ISSUE.skills.map(s=>`<span class="skill-chip">${s}</span>`).join('')}</div>
      <p style="font-size:0.8rem;">${ISSUE.level}</p>
      ${best}
      <div class="btn-row"><button class="btn primary" onclick="SND.click();S=freshState();S.phase='briefing';render()">▶ Begin Issue 03</button></div>
      <div class="btn-row"><a class="btn" href="game-response.html">📚 All Issues</a></div>
    </div>`;
}

/* ---------- BRIEFING ---------- */
function viewBriefing(){
  return `
    <div class="panel-frame"><span class="issue-tag">ISSUE ${ISSUE.n}</span>${sceneBriefing()}</div>
    <div class="caption-box">The community center has been a shelter since the power went out two days ago —
      rows of cots, battery lanterns, dozens of displaced neighbors trying to rest. A shelter volunteer finds you
      near the entrance.</div>
    <div class="speech-wrap"><div class="speech-bubble"><div class="speech-name">Shelter Coordinator</div>
      "I don't want to alarm anyone, but there's a woman over on cot 14 who doesn't seem like herself. Could you
      just... check on her?"</div></div>
    <div class="btn-row"><button class="btn primary" onclick="SND.click();S.phase='establish';render()">Walk over →</button></div>`;
}

/* ---------- ESTABLISH ---------- */
function viewEstablish(){
  return `
    <div class="panel-frame">${sceneEstablish()}</div>
    <div class="caption-box">The gym is warm and still — no power for fans, just battery lanterns casting long
      shadows between the cots. Nothing looks urgent from here. Before you talk to her, it's worth taking in
      what's around her.</div>
    <div class="btn-row"><button class="btn primary" onclick="SND.click();S.phase='cluehunt';render()">Look around her cot →</button></div>`;
}

/* ---------- CLUE HUNT ---------- */
function clickHotspot(id){
  if(S.phase==='cluehunt'){
    if(id.startsWith('clue-')){
      const key = id.slice(5);
      if(S.clues[key]) return;
      S.clues[key] = true; SND.good();
      render(); showTempNote(CLUES[key]); return;
    }
    return;
  }
  if(S.phase==='primary'){
    if(id==='chk-orient'&&!S.checks.orient){ S.checks.orient=true; SND.click(); S.lastFinding=PRIMARY_REACTIONS[id]; }
    else if(id==='chk-skin'&&!S.checks.skin){ S.checks.skin=true; SND.click(); S.lastFinding=PRIMARY_REACTIONS[id]; }
    else if(id==='chk-breathing'&&!S.checks.breathing){ S.checks.breathing=true; SND.click(); S.lastFinding=PRIMARY_REACTIONS[id]; }
    render(); return;
  }
}
function cluehuntHotspots(){
  return hotspot(295,300,32,'clue-granola',S.clues.granola,S.hintTarget==='clue-granola')
    + hotspot(360,245,38,'clue-medkit',S.clues.medkit,S.hintTarget==='clue-medkit')
    + hotspot(565,235,32,'clue-juice',S.clues.juice,S.hintTarget==='clue-juice')
    + hotspot(460,295,28,'clue-photo',S.clues.photo,S.hintTarget==='clue-photo');
}
function hintCurrentPhase(){
  SND.click();
  const phase = S.phase;
  let remaining = [];
  if(phase==='cluehunt'){
    remaining = Object.keys(S.clues).filter(k=>!S.clues[k]).map(k=>'clue-'+k);
  } else if(phase==='primary'){
    const need = {'chk-orient':!S.checks.orient,'chk-skin':!S.checks.skin,'chk-breathing':!S.checks.breathing};
    remaining = Object.keys(need).filter(id=>need[id]);
  }
  if(!remaining.length) return;
  S.hintTarget = remaining[0];
  render();
  setTimeout(()=>{ if(S.phase===phase){ S.hintTarget=null; render(); } }, 2600);
}
function viewCluehunt(){
  const hs = cluehuntHotspots();
  const found = Object.values(S.clues).filter(Boolean).length;
  const clueList = Object.keys(S.clues).filter(k=>S.clues[k]).map(k=>`<li>${CLUES[k]}</li>`).join('');
  return `
    <div class="panel-frame">${sceneCluehunt(hs)}</div>
    <div class="caption-box">Her cot and belongings are right here. <b>Look around</b> before you wake her.</div>
    ${clueList?`<div class="notes-panel"><h4>What you notice</h4><ul>${clueList}</ul></div>`:''}
    <div class="btn-row">
      <button class="btn" onclick="hintCurrentPhase()">🔍 Hint</button>
      <button class="btn primary" onclick="SND.click();finishCluehunt()">Wake her and introduce yourself →</button>
    </div>
    ${found<2?'<div class="hint-row">Take a moment to look around before you start.</div>':''}`;
}
function finishCluehunt(){
  const found = Object.values(S.clues).filter(Boolean).length;
  if(found>=3){ praise(`Noticed ${found}/4 details around her before starting — the diabetes kit and food wrappers matter later.`); }
  else { deduct('assessment', (3-found)*12, `Only noticed ${found} of 4 details in the area — some of what was around her cot went unobserved.`); }
  S.phase='primary'; render();
}

/* ---------- PRIMARY (mental status / skin / breathing) ---------- */
function viewPrimary(){
  const hs = hotspot(350,140,36,'chk-orient',S.checks.orient,S.hintTarget==='chk-orient')
    + hotspot(330,460,34,'chk-skin',S.checks.skin,S.hintTarget==='chk-skin')
    + hotspot(330,230,32,'chk-breathing',S.checks.breathing,S.hintTarget==='chk-breathing');
  const allDone = S.checks.orient && S.checks.skin && S.checks.breathing;
  return `
    <div class="panel-frame">${scenePatient('unwell', hs)}</div>
    <div class="speech-wrap"><div class="speech-bubble"><div class="speech-name">Patient</div>
      ${S.lastFinding || '"...hm? Oh — hello."'}</div></div>
    <div class="notes-panel"><h4>Assessment</h4><ul>
      <li>${S.checks.orient?'✅':'⬜'} Mental status / orientation</li>
      <li>${S.checks.skin?'✅':'⬜'} Skin condition</li>
      <li>${S.checks.breathing?'✅':'⬜'} Breathing / heart rate</li>
    </ul></div>
    ${allDone?'':'<div class="btn-row"><button class="btn" onclick="hintCurrentPhase()">🔍 Hint</button></div>'}
    <div class="btn-row"><button class="btn primary" ${allDone?'':'disabled'} onclick="finishPrimary()">Continue to interview →</button></div>
    ${allDone?'':'<div class="hint-row">Click her to complete the assessment.</div>'}`;
}
function finishPrimary(){
  praise('Checked mental status, skin condition, and breathing before jumping to conclusions.');
  S.phase='interview'; render();
}

/* ---------- INTERVIEW ---------- */
const QUESTIONS = [
  {id:'orient', q:'"What\'s your name, and do you know where you are?"', a:'"M-Margaret... we\'re at the... the school, the shelter place. Sorry, I\'m a little foggy."'},
  {id:'ate', q:'"When did you last eat something?"', a:'"I... I\'m not sure. This morning, maybe? Everything\'s been so rushed."'},
  {id:'conditions', q:'"Do you have any medical conditions?"', a:'"Diabetes. Type 2."'},
  {id:'meds', q:'"Are you taking any medications?"', a:'"Glipizide, twice a day. I think I missed my morning dose with everything going on — or maybe I took it and just didn\'t eat."'},
  {id:'allergies', q:'"Are you allergic to anything?"', a:'"No, nothing I know of."'},
  {id:'water', q:'"Have you been drinking enough water? It\'s pretty warm in here."', a:'"I... don\'t know. It is warm, isn\'t it?"'},
  {id:'feel', q:'"Do you feel dizzy, shaky, or unwell in any particular way?"', a:'"Shaky. Sweaty. My heart feels like it\'s racing a little."'}
];
function viewInterview(){
  const answered = QUESTIONS.filter(q=>S.asked[q.id]).map(q=>`<li><b>${q.q}</b> ${q.a}</li>`).join('');
  const opts = QUESTIONS.filter(q=>!S.asked[q.id]).map((q,i)=>
    `<div class="opt" onclick="askQ('${q.id}')"><div class="n">${i+1}</div>${q.q}</div>`).join('');
  const bubble = S.lastAsked ? QUESTIONS.find(q=>q.id===S.lastAsked).a
    : '"Sorry... I just feel a little off. Probably nothing."';
  return `
    <div class="panel-frame">${scenePatient('unwell')}</div>
    <div class="speech-wrap"><div class="speech-bubble"><div class="speech-name">Patient</div>
      ${bubble}</div></div>
    ${answered?`<div class="notes-panel"><h4>What you've learned</h4><ul>${answered}</ul></div>`:''}
    <div class="opts">${opts}</div>
    <div class="btn-row"><button class="btn primary" onclick="finishInterview()">Decide how to help her →</button></div>`;
}
function askQ(id){ SND.click(); S.asked[id]=true; S.lastAsked=id; render(); }
function finishInterview(){
  const asked = Object.keys(S.asked).length;
  if(asked>=5){ praise(`Gathered a thorough history (${asked}/7 questions asked) — enough to recognize the pattern.`); }
  else { deduct('communication', (5-asked)*12, `Only asked ${asked} of 7 available questions — some details pointing to the real cause were never gathered.`); }
  S.phase='treatment'; render();
}

/* ---------- TREATMENT (diagnosis decision) ---------- */
const TREATMENTS = [
  {id:'glucose', t:'Help her drink the juice box or take a glucose tablet from her bag — she\'s alert enough to swallow safely', good:true},
  {id:'monitor', t:'Stay with her and monitor how she responds', good:true},
  {id:'cool', t:'Lie her down and place cool cloths on her for the heat', good:false,
    note:'The warm room is real, but her skin, confusion, and skipped meal point to low blood sugar, not heat illness. Cooling her won\'t fix the actual cause.'},
  {id:'meds', t:'Help her take her glipizide, since she mentioned missing a dose', good:false,
    note:'Glipizide lowers blood sugar — giving more of it to someone who may already be hypoglycemic could make her significantly worse. Never give a patient more of their own medication to "catch up."'},
  {id:'rest', t:'Let her rest without any treatment — she\'ll be fine', good:false,
    note:"An altered, sweaty, shaky diabetic patient who skipped a meal needs sugar, not just rest — untreated hypoglycemia can get worse quickly."}
];
function viewTreatment(){
  const list = TREATMENTS.map((t,i)=>{
    const done = S.given[t.id];
    return `<div class="opt ${done?'done':''}" onclick="${done?'':`pickTreatment('${t.id}')`}"><div class="n">${done?'✓':i+1}</div>${t.t}</div>`;
  }).join('');
  const coreGiven = S.given.glucose && S.given.monitor;
  return `
    <div class="panel-frame">${scenePatient('unwell')}</div>
    <div class="caption-box">You've got a history, a scene full of clues, and a patient who trusts you. What do you do?</div>
    <div class="opts">${list}</div>
    <div class="btn-row"><button class="btn primary" ${coreGiven?'':'disabled'} onclick="finishTreatment()">Continue to reassessment →</button></div>
    ${coreGiven?'':'<div class="hint-row">Figure out what she actually needs, then stay with her.</div>'}`;
}
function pickTreatment(id){
  const t = TREATMENTS.find(x=>x.id===id);
  if(t.good){ S.given[id]=true; SND.good(); praise(t.t+' — the right call.'); render(); return; }
  S.mistakes++; SND.bad(); deduct('treatment', 18, t.note);
  M.querySelector('.panel-frame').insertAdjacentHTML('afterend',
    `<div class="instr-note" id="tnote"><b>Not quite:</b> ${t.note}</div>`);
  setTimeout(()=>{ const n=document.getElementById('tnote'); if(n) n.remove(); }, 4200);
}
function finishTreatment(){
  S.stage = (S.given.glucose && S.mistakes===0) ? 'recovering' : (S.mistakes>=2 || !S.given.glucose) ? 'deteriorated' : 'recovering';
  S.phase='reassess'; render();
}

/* ---------- REASSESS ---------- */
function viewReassess(){
  const good = S.stage==='recovering';
  const text = good
    ? '"...that\'s better. I feel a lot less foggy." Her color has improved and she\'s tracking the conversation clearly now.'
    : 'She still seems confused, and if anything a little more withdrawn than before. Whatever was going on hasn\'t improved.';
  if(good) praise('Reassessment showed real improvement — she\'s alert and oriented now.');
  else deduct('reassessment', 20, 'Reassessment showed she was not improving — the underlying cause was never actually addressed.');
  return `
    <div class="panel-frame">${scenePatient(S.stage)}</div>
    <div class="caption-box">You check on her again. ${text}</div>
    <div class="btn-row"><button class="btn primary" onclick="SND.click();S.phase='disposition';render()">Decide next steps →</button></div>`;
}

/* ---------- DISPOSITION ---------- */
function viewDisposition(){
  return `
    <div class="panel-frame">${scenePatient(S.stage)}</div>
    <div class="caption-box">What's the right next step for Margaret?</div>
    <div class="opts">
      <div class="opt" onclick="pickDisposition('nothing')"><div class="n">1</div>She's fine now — no further monitoring needed</div>
      <div class="opt" onclick="pickDisposition('watch')"><div class="n">2</div>Have her rest with food nearby, recheck on her in a few minutes</div>
      <div class="opt" onclick="pickDisposition('ems')"><div class="n">3</div>Request EMS evaluation given her diabetes and the shelter conditions</div>
    </div>`;
}
function pickDisposition(pick){
  S.dispositionPick = pick;
  if(pick==='nothing'){
    SND.bad(); deduct('prioritization', 25, 'A diabetic patient who was just altered needs at least a recheck before anyone calls it "fine" — blood sugar can drop again.');
  } else if(pick==='ems'){
    SND.good(); praise('Requested EMS evaluation — appropriately cautious given her diabetes and the ongoing shelter conditions.');
  } else if(pick==='watch'){
    if(S.stage==='recovering'){ SND.good(); praise('Kept her resting with food nearby and planned a recheck — a good match for how well she responded.'); }
    else { SND.bad(); deduct('prioritization', 15, "Given she wasn't improving, she needed more than a plan to check back later — EMS evaluation would have been safer."); }
  }
  S.phase='outcome'; render();
}

/* ---------- OUTCOME ---------- */
function viewOutcome(){
  const good = S.stage==='recovering' && S.dispositionPick!=='nothing';
  const text = good
    ? 'Margaret finishes the juice box and, twenty minutes later, is chatting with her neighbor on the next cot like nothing happened. The shelter coordinator thanks you quietly on your way out. A quiet save — nobody else in the gym even noticed anything happened.'
    : "Margaret is still not quite herself by the time you check on her again. She'll be okay with more attention, but it took longer than it needed to. Every missed clue here is one you'll catch on a real call.";
  return `
    <div class="panel-frame">${scenePatient(S.stage)}</div>
    <div class="caption-box"><b>A while later.</b> ${text}</div>
    <div class="btn-row"><button class="btn primary" onclick="SND.win();showDebrief()">See your debrief →</button></div>`;
}

/* ---------- DEBRIEF ---------- */
function showDebrief(){
  const cats = S.score;
  const pct = Math.round(Object.values(cats).reduce((a,b)=>a+b,0)/Object.keys(cats).length);
  const stars = pct>=90?3:pct>=70?2:1;
  saveProgress(pct, stars);
  S.phase='debrief'; S._pct=pct; S._stars=stars;
  render();
}
function viewDebrief(){
  const pct = S._pct, stars = S._stars;
  const rows = Object.entries(S.score).map(([k,v])=>{
    const lbl = {assessment:'Assessment',prioritization:'Prioritization',
      communication:'Communication',treatment:'Treatment',reassessment:'Reassessment'}[k];
    return `<div class="score-item"><div class="lbl">${lbl}</div><div class="val">${Math.round(v)}%</div></div>`;
  }).join('');
  const good = S.log.filter(l=>l.ok).map(l=>`<div class="check-item ok"><span class="ic">✓</span>${l.text}</div>`).join('');
  const warn = S.log.filter(l=>!l.ok).map(l=>`<div class="check-item warn"><span class="ic">⚠</span>${l.text}</div>`).join('');
  return `
    <div class="card">
      <h3>Debrief — Issue ${ISSUE.n}: ${ISSUE.title}</h3>
      <div class="overall"><div class="pct">${pct}%</div><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div></div>
      <div class="score-grid">${rows}</div>
      <div class="check-list">${good}${warn}</div>
      <div class="btn-row">
        <button class="btn primary" onclick="SND.click();S=freshState();S.phase='briefing';render()">↻ Replay Issue 03</button>
        <a class="btn" href="game-response.html">📚 All Issues</a>
      </div>
    </div>`;
}

/* ============================================================
   VIEW TABLE + BOOT
============================================================ */
const VIEWS = {
  cover: viewCover, briefing: viewBriefing, establish: viewEstablish, cluehunt: viewCluehunt,
  primary: viewPrimary, interview: viewInterview, treatment: viewTreatment,
  reassess: viewReassess, disposition: viewDisposition, outcome: viewOutcome, debrief: viewDebrief
};

SND.init();
render();
</script>
</body>
</html>
